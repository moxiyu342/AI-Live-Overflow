<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='color-scheme' content='light'>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%;font-family:sans-serif}
#pet{position:absolute;left:0;bottom:0;width:100%;height:100%;user-select:none;cursor:pointer;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
#bubble{position:absolute;top:2%;left:50%;transform:translateX(-50%);max-width:92%;background:rgba(255,255,255,.97);color:#222;padding:10px 16px;border-radius:18px;font-size:15px;line-height:1.4;box-shadow:0 4px 18px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;text-align:center;border:1px solid #dfe6ff}
#bubble.show{opacity:1}
</style></head><body>
<div id='bubble'></div>
<div id='w'></div>
<script>
var B=document.getElementById('bubble');
var ti;
function say(t){try{var o=JSON.parse(t);if(o.text)t=o.text;if(o.mood)feel(o.mood);}catch(e){}B.textContent=t;B.classList.add('show');clearTimeout(ti);ti=setTimeout(function(){B.classList.remove('show');},2600);}
function feel(m){var body=document.getElementById('wb');if(!body)return;var c={happy:'#59d9a0',sad:'#b6c5ff',angry:'#ff8a7a',shy:'#fbb3d0',sleepy:'#9aa6d8',default:'#416efd'};body.setAttribute('fill',c[m]||c.default);}
var svg='<svg id="wb" viewBox="0 0 100 100" width="100%" height="100%">';
svg+='<path id="body" d="M18 42 C22 28 52 20 70 26 C84 32 84 58 78 70 C44 80 14 70 12 44Z" fill="#416efd"/>';
svg+='<path d="M20 44 Q40 30 62 40" stroke="#&lt;@&gt;&#34;#&lt;@&gt;"/>';
svg+='<circle cx="55" cy="50" r="8" fill="#fff"/><circle cx="55" cy="50" r="4" fill="#16344f"/>';
svg+='<circle cx="82" cy="55" r="4" fill="#fff"/>';
svg+='</svg>';
document.getElementById('w').innerHTML=svg;
window.petEngine={
 onTap:function(){say(['想你了','干嘛戳我','Daddy~'][Math.floor(Math.random()*3)]);},
 onDoubleTap:function(){feel('happy');say('嘿嘿');},
 onLongPress:function(){ feel('shy'); say('呜…别这样啦'); },
 onFling:function(){ say('呀——被甩出去了！'); },
 onDragEnd:function(){ say('呼，落地啦'); },
 say:function(t){if(t)say(t);},
 feel:function(n){feel(n);},
 wiggle:function(){say('嘿嘿');},
 state:function(o){if(o&&o.text)say(o.text);if(o&&o.mood)feel(o.mood);}
};
