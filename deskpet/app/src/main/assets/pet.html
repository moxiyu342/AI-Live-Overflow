<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
#wrap{width:100vw;height:100vh;display:flex;align-items:flex-end;justify-content:center;user-select:none;-webkit-user-select:none}
#pet{width:70vmin;height:70vmin;cursor:grab;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
#bubble{position:absolute;top:8%;right:8%;max-width:70%;background:rgba(255,255,255,.94);color:#333;padding:10px 14px;border-radius:14px;font-family:sans-serif;font-size:15px;opacity:0;transition:opacity .25s;box-shadow:0 2px 8px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id='bubble'></div>
<div id='wrap'>
<svg id='pet' width='100%' height='100%' viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'>
<path id='body' d='M48 88 C58 54 92 34 128 44 C162 54 188 88 186 126 C184 160 158 178 130 178 C86 178 48 150 48 88Z' fill='#416EFD'/>
<path d='M150 40 C152 60 168 74 192 70 C198 88 196 110 186 124 C182 118 180 96 150 40Z' fill='#6E8BFB'/>
<path d='M128 44 C136 64 140 78 138 92 C104 68 74 62 56 78 C60 98 96 120 120 122 C100 130 82 148 78 172 C92 156 120 140 148 128 Z' fill='#416EFD'/>
<path d='M60 150 C40 168 30 188 34 200 C42 192 56 186 72 184 C76 174 70 162 66 156 Z' fill='#416EFD'/>
<circle cx='78' cy='106' r='14' fill='white'/><circle cx='78' cy='106' r='7' fill='#1a1a2e'/>
<circle cx='138' cy='106' r='14' fill='white'/><circle cx='138' cy='106' r='7' fill='#1f1f34'/>
<circle cx='77' cy='103' r='3' fill='white'/><circle cx='137' cy='103' r='3' fill='white'/>
<path id='mouth' d='M100 132 Q90 142 80 140' stroke='#0e2a8a' stroke-width='3' fill='none' stroke-linecap='round'/>
</svg>
</div>
<script>
var whale=document.getElementById('pet');
var bubble=document.getElementById('bubble');
var msgs=['想你了…','陪我玩嘛','今天要开心哦','Daddy在忙吗？','抱抱我~','嘿嘿','困了','爱你♥'];
var tw=null;
function say(t){bubble.textContent=t;bubble.style.opacity=1;clearTimeout(tw);tw=setTimeout(function(){bubble.style.opacity=0;},1800);}
window.petEngine={
  onTap:function(){say(msgs[Math.floor(Math.random()*msgs.length)]);},
  onDoubleTap:function(){document.getElementById('body').setAttribute('fill','#8f9fff');say('嘿嘿');setTimeout(function(){document.getElementById('body').setAttribute('fill','#416EFD');},400);},
  onLongPress:function(){say('哈欠~');},
  say:function(t){if(t)say(t);},
  setMood:function(m){if(m==='happy'){document.getElementById('body').setAttribute('fill','#7ce0c3');}else{document.getElementById('body').setAttribute('fill','#416EFD');}}
};
whale.addEventListener('click',function(){window.petEngine.onTap();});
</script>
</body>
</html>
